<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Object Creator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: #fff;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 320px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    label {
      font-weight: bold;
      margin: 5px 0;
      display: block;
    }

    input {
      width: 100%;
      padding: 8px;
      margin: 5px 0 15px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #0056b3;
    }

    .output {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #f9f9f9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Create an Animal</h2>
    
    <label for="animalName">Animal Name:</label>
    <input type="text" id="animalName" placeholder="e.g. Dog">

    <label for="animalColor">Animal Color:</label>
    <input type="text" id="animalColor" placeholder="e.g. Brown">

    <label for="animalAge">Animal Age:</label>
    <input type="number" id="animalAge" placeholder="e.g. 3">

    <button id="createBtn">Create Animal</button>

    <div class="output" id="outputArea">
      <p><strong>Created Animal Details Will Appear Here</strong></p>
    </div>
  </div>

  <script>
    // Step 1: Define Animal class
    class Animal {
      constructor(name, color, age) {
        this.AnimalName = name;
        this.AnimalColor = color;
        this.AnimalAge = age;
      }

      describe() {
        return `${this.AnimalName} is ${this.AnimalColor} and ${this.AnimalAge} years old.`;
      }
    }

    // Step 2: Handle form submission
    document.getElementById("createBtn").addEventListener("click", function() {
      const name = document.getElementById("animalName").value;
      const color = document.getElementById("animalColor").value;
      const age = document.getElementById("animalAge").value;

      if (!name || !color || !age) {
        alert("Please fill all fields!");
        return;
      }

      const newAnimal = new Animal(name, color, age);

      // Display result
      document.getElementById("outputArea").innerHTML = `
        <h3>Animal Created:</h3>
        <p><strong>Name:</strong> ${newAnimal.AnimalName}</p>
        <p><strong>Color:</strong> ${newAnimal.AnimalColor}</p>
        <p><strong>Age:</strong> ${newAnimal.AnimalAge}</p>
        <p><em>${newAnimal.describe()}</em></p>
      `;

      console.log(newAnimal); // for debugging
    });
  </script>
</body>
</html>
